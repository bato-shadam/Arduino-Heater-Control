
name: Build ESP8266 Firmware

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Setup ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Install libraries from libraries.txt
        run: |
          while read lib; do
            arduino-cli lib install "$lib"
          done < libraries.txt

      - name: Detect Arduino sketch
        id: sketch
        run: |
          INO=$(find . -maxdepth 2 -name "*.ino" | head -n 1)
          if [ -z "$INO" ]; then
            echo "ERROR: No INO file found!"
            exit 1
          fi
          SKETCH_DIR=$(dirname "$INO")
          SKETCH_NAME=$(basename "$INO" .ino)
          echo "dir=$SKETCH_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$SKETCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Compile ESP8266 firmware
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir build \
            "${{ steps.sketch.outputs.dir }}"

      - name: Rename firmware BIN
        run: |
          mv build/*.bin "build/${{ steps.sketch.outputs.name }}.bin"

      - name: Upload firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sketch.outputs.name }}_bin
          path: build/${{ steps.sketch.outputs.name }}.bin
